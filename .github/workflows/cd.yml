name: CD

# Entrega contínua simulada: roda somente depois que o CI da main termina com sucesso.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# O CD só lê o código e publica artefatos do próprio workflow.
permissions:
  contents: read

# Uma entrega por vez; nenhuma é cancelada no meio.
concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  deploy:
    name: CD simulado (imagem Docker)
    # Só entrega código que passou no CI após um push (merge) na main.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: producao-simulada
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      FEATURE_ID: "17"
    steps:
      - name: Checkout do commit aprovado no CI
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SHA }}

      - name: Definir identificação da imagem
        run: |
          echo "SHORT_SHA=${SHA:0:7}" >> "$GITHUB_ENV"
          echo "IMAGE=lab40:${SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_FILE=lab40-${SHA:0:7}.tar" >> "$GITHUB_ENV"

      - name: Construir imagem identificada pelo SHA
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${SHA}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -t "$IMAGE" -t "lab40:sha-${SHORT_SHA}" .
          docker image ls lab40

      - name: Implantação simulada (executar container)
        run: |
          docker run -d --name lab40 -p 3000:3000 "$IMAGE"
          curl --fail --silent --retry 15 --retry-delay 1 --retry-connrefused \
            http://localhost:3000/health | tee health.json
          echo
          curl --fail --silent -X POST "http://localhost:3000/api/features/${FEATURE_ID}" \
            -H "Content-Type: application/json" -d '{"valores":[8,2,5]}' | tee feature.json
          echo

      - name: Exportar imagem (.tar)
        run: |
          docker save "$IMAGE" -o "$IMAGE_FILE"
          ls -lh "$IMAGE_FILE"

      - name: Gerar deployment-record.txt
        run: |
          {
            echo "LAB40 - REGISTRO DE IMPLANTAÇÃO (CD SIMULADO)"
            echo "============================================="
            echo "Status                : SUCESSO"
            echo "Ambiente              : producao-simulada"
            echo "Data/hora (UTC)       : $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "Repositório           : ${{ github.repository }}"
            echo "Branch                : main"
            echo "Commit (SHA)          : ${SHA}"
            echo "Responsável           : ${{ github.actor }}"
            echo "Workflow CI de origem : #${{ github.event.workflow_run.run_number }} (${{ github.event.workflow_run.html_url }})"
            echo "Workflow CD           : #${{ github.run_number }} (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo
            echo "IMAGEM"
            echo "Tags                  : ${IMAGE}, lab40:sha-${SHORT_SHA}"
            echo "Image ID              : $(docker image inspect "$IMAGE" --format '{{.Id}}')"
            echo "Tamanho               : $(( $(docker image inspect "$IMAGE" --format '{{.Size}}') / 1024 / 1024 )) MB"
            echo "Arquivo entregue      : ${IMAGE_FILE}"
            echo "SHA-256 do arquivo    : $(sha256sum "$IMAGE_FILE" | cut -d' ' -f1)"
            echo
            echo "VERIFICAÇÕES APÓS A IMPLANTAÇÃO"
            echo "GET /health           : $(cat health.json)"
            echo "POST /api/features/17 : $(cat feature.json)"
          } > deployment-record.txt
          cat deployment-record.txt
          {
            echo "### CD simulado concluído"
            echo
            echo '```'
            cat deployment-record.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Entregar imagem .tar e deployment-record.txt
        uses: actions/upload-artifact@v6
        with:
          name: entrega-lab40-${{ env.SHORT_SHA }}
          path: |
            ${{ env.IMAGE_FILE }}
            deployment-record.txt
          retention-days: 30

      - name: Log do container (em caso de falha)
        if: failure()
        run: docker logs lab40 || true
