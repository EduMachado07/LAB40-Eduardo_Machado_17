name: CI

# Integração contínua: roda em todo Pull Request para a main e em cada push na main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Menor privilégio: o CI só precisa ler o código.
permissions:
  contents: read

# Um novo commit na mesma branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FEATURE_ID: "17"

jobs:
  # 1. Análise estática do código (ESLint)
  lint:
    name: 1. Análise estática
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: ESLint
        run: npm run lint

  # 2. Testes unitários e de integração nas versões suportadas do Node.js
  test:
    name: 2. Testes (Node ${{ matrix.node }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        if: matrix.node != 22
        run: npm test

      - name: Executar testes com cobertura
        if: matrix.node == 22
        run: npm run test:coverage

      - name: Publicar relatório de cobertura
        if: matrix.node == 22
        uses: actions/upload-artifact@v6
        with:
          name: cobertura-lcov
          path: lcov.info
          retention-days: 7

  # 3. Build de produção e teste de fumaça com o servidor real
  build:
    name: 3. Build e teste de fumaça
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar somente dependências de produção
        run: npm ci --omit=dev

      - name: Subir o servidor e verificar endpoints
        env:
          PORT: 3000
        run: |
          npm start > server.log 2>&1 &
          curl --fail --silent --retry 10 --retry-delay 1 --retry-connrefused \
            http://localhost:3000/health
          echo
          curl --fail --silent -X POST "http://localhost:3000/api/features/${FEATURE_ID}" \
            -H "Content-Type: application/json" -d '{"valores":[8,2,5]}'
          echo

      - name: Log do servidor (em caso de falha)
        if: failure()
        run: cat server.log || true

  # 4. Build da imagem Docker (sem publicar) e teste do container
  docker:
    name: 4. Build da imagem Docker
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: lab40:${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Construir imagem identificada pelo SHA
        run: docker build -t "$IMAGE" .

      - name: Executar container e verificar endpoints
        run: |
          docker run -d --name lab40 -p 3000:3000 "$IMAGE"
          curl --fail --silent --retry 15 --retry-delay 1 --retry-connrefused \
            http://localhost:3000/health
          echo
          curl --fail --silent -X POST "http://localhost:3000/api/features/${FEATURE_ID}" \
            -H "Content-Type: application/json" -d '{"valores":[8,2,5]}'
          echo
          docker image ls lab40

      - name: Log do container (em caso de falha)
        if: failure()
        run: docker logs lab40 || true
